  </g>
  
  <text x="250" y="260" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="700" fill="#4c1d95">Beyond the Code</text>
  <text x="250" y="285" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="500" fill="#7c3aed">Anjan Kumar Gandi • Personal Photo</text>
